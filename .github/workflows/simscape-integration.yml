name: Optional Simscape integration

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  integration:
    name: Licensed Simscape integration
    # Manual dispatch plus the dedicated label prevents accidental execution
    # on a hosted runner without the required licensed products.
    runs-on: [self-hosted, thermoweave-simscape]
    timeout-minutes: 60
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up MATLAB R2024a or newer
        uses: matlab-actions/setup-matlab@f9e43010f1ae678f7cfa0542fe2a4f60f7d1ad8d # v3
        with:
          release: R2024a

      - name: Run gated integration build
        uses: matlab-actions/run-build@cf54c2229a74d57eb4e6ba1bbebd45793d37797e # v3
        with:
          tasks: integration
