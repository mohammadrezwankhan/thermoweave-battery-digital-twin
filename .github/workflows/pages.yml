name: Documentation Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check the learning dashboard before publishing
        env:
          EXPECTED_REPOSITORY: ${{ github.repository }}
        run: |
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          docs = Path('docs')
          page = (docs / 'index.html').read_text(encoding='utf-8')
          config = json.loads((docs / 'lesson-config.json').read_text(encoding='utf-8'))
          assert 'data-flagship-repo="' + os.environ['EXPECTED_REPOSITORY'] + '"' in page
          assert 'data-flagship-version="1.0"' in page
          assert 'data-flagship-build="' in page
          assert len(config['modules']) == 4
          assert config['repository']['owner'] + '/' + config['repository']['slug'] == os.environ['EXPECTED_REPOSITORY']
          for item in docs.rglob('*'):
              assert not item.is_symlink(), 'Pages artifact cannot contain symlinks: ' + str(item)
          print('Dashboard identity and four lesson modules verified before upload.')
          PY

      - name: Configure Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Upload static documentation
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: docs

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
