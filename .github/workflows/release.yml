name: Release package

on:
  push:
    tags:
      - 'v*'

permissions: {}

jobs:
  release:
    name: Build and package semver release
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0

      - name: Verify semantic-version tag
        shell: bash
        run: |
          if [[ ! "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "Tag is not a semantic version: $GITHUB_REF_NAME" >&2
            exit 1
          fi

      - name: Set up MATLAB R2024a
        uses: matlab-actions/setup-matlab@2323adb8243827ea460b0def4c413545aaec46a9 # v3
        with:
          release: R2024a

      - name: Run release build task
        uses: matlab-actions/run-build@ed1a00aeaf0b3e7946e28e8263eb5fe5ec232106 # v3
        with:
          tasks: package

      - name: Verify generated package and checksum
        shell: bash
        run: |
          test -s release/thermoweave-source.zip
          test -s release/release-manifest.json
          unzip -t release/thermoweave-source.zip
          sha256sum release/thermoweave-source.zip > release/thermoweave-source.zip.sha256
          sha256sum -c release/thermoweave-source.zip.sha256

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh release create "$GITHUB_REF_NAME" \
            "release/thermoweave-source.zip" \
            "release/thermoweave-source.zip.sha256" \
            "release/release-manifest.json" \
            --verify-tag --generate-notes
