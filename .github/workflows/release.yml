name: Release package

on:
  push:
    tags:
      - 'v*'

permissions: {}

jobs:
  release:
    name: Build and package semver release
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
      actions: read
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Verify semantic-version tag
        shell: bash
        run: |
          if [[ ! "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "Tag is not a semantic version: $GITHUB_REF_NAME" >&2
            exit 1
          fi

      - name: Find exact-source licensed evidence
        id: licensed-evidence
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          export EXPECTED_SOURCE_SHA="$(git rev-parse HEAD)"
          selection=$(python3 scripts/select_licensed_pages_artifact.py --latest)
          read -r run_id artifact_id <<< "$selection"
          printf 'sha=%s\nrun_id=%s\nartifact_id=%s\n' "$EXPECTED_SOURCE_SHA" "$run_id" "$artifact_id" >> "$GITHUB_OUTPUT"

      - name: Download exact-source licensed release bundle
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ steps.licensed-evidence.outputs.artifact_id }}
          run-id: ${{ steps.licensed-evidence.outputs.run_id }}
          github-token: ${{ github.token }}
          digest-mismatch: error
          path: ${{ runner.temp }}/thermoweave-licensed-release-evidence

      - name: Require final-source scientific evidence and all mandatory gates
        env:
          EXPECTED_SOURCE_SHA: ${{ steps.licensed-evidence.outputs.sha }}
          SCIENTIFIC_EVIDENCE_ROOT: ${{ runner.temp }}/thermoweave-licensed-release-evidence
        shell: bash
        run: |
          python3 scripts/verify_release_readiness.py
          python3 scripts/verify_licensed_release_package.py
          mkdir -p release
          cp "$SCIENTIFIC_EVIDENCE_ROOT/release/thermoweave-source.zip" release/
          cp "$SCIENTIFIC_EVIDENCE_ROOT/release/release-manifest.json" release/
          sha256sum release/thermoweave-source.zip > release/thermoweave-source.zip.sha256
          sha256sum -c release/thermoweave-source.zip.sha256

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh release create "$GITHUB_REF_NAME" \
            "release/thermoweave-source.zip" \
            "release/thermoweave-source.zip.sha256" \
            "release/release-manifest.json" \
            --verify-tag --generate-notes
