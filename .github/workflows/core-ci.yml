name: Core CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  core:
    name: MATLAB R2024a core build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up MATLAB R2024a
        uses: matlab-actions/setup-matlab@v3
        with:
          release: R2024a

      - name: Run core build and tests
        uses: matlab-actions/run-build@v3
        with:
          tasks: test
