name: Core CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  core:
    name: MATLAB R2024a core build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up MATLAB R2024a
        uses: matlab-actions/setup-matlab@f9e43010f1ae678f7cfa0542fe2a4f60f7d1ad8d # v3
        with:
          release: R2024a

      - name: Run core build and tests
        uses: matlab-actions/run-build@ed1a00aeaf0b3e7946e28e8263eb5fe5ec232106 # v3
        with:
          tasks: test
